<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">One conversation. One decision-making service.</title><desc id="desc">A carrier wants freight. The brokerage wants an eligible carrier at an authorized rate.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  THE SYSTEM, EXPLAINED</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">One conversation. One decision-making service.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">A carrier wants freight. The brokerage wants an eligible carrier at an authorized rate.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><rect x="64" y="230" width="265" height="100" rx="50.0" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><text x="196.5" y="265" font-size="23" fill="#B46217" font-weight="700" text-anchor="middle">YOU, THE CARRIER</text><text x="196.5" y="294" font-size="18" fill="#18333D" font-weight="400" text-anchor="middle">Maria, demo dispatcher</text><rect x="410" y="222" width="300" height="120" rx="10" fill="#F1ECF8" stroke="#7150A3" stroke-width="1.4"/><text x="430" y="252" font-size="13" fill="#7150A3" font-weight="700" text-anchor="start">HAPPYROBOT</text><text x="430" y="282" font-size="23" fill="#7150A3" font-weight="700" text-anchor="start">Voice workflow</text><text x="430" y="312" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Listens, asks and speaks.</text><text x="430" y="338" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Requests six service tools.</text><rect x="810" y="220" width="360" height="190" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="830" y="250" font-size="13" fill="#087F78" font-weight="700" text-anchor="start">OUR PYTHON / FASTAPI CODE</text><text x="830" y="280" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Carrier Sales Service</text><text x="830" y="310" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Checks eligibility, code, loads and</text><text x="830" y="336" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">rates. Saves decisions.</text><text x="830" y="362" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Only rep Confirm can send.</text><path d="M330,277 L410,277" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="370" y="261" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">speech</text><path d="M710,280 L810,280" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="760" y="260" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">tool + run ID</text><rect x="64" y="490" width="265" height="115" rx="57.5" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><text x="196.5" y="525" font-size="23" fill="#B46217" font-weight="700" text-anchor="middle">Senior rep</text><text x="196.5" y="554" font-size="18" fill="#18333D" font-weight="400" text-anchor="middle">Reviews the agreement.</text><rect x="410" y="477" width="300" height="145" rx="10" fill="#F1ECF8" stroke="#7150A3" stroke-width="1.4"/><text x="430" y="507" font-size="13" fill="#7150A3" font-weight="700" text-anchor="start">HAPPYROBOT APPS / NEXT.JS</text><text x="430" y="537" font-size="23" fill="#7150A3" font-weight="700" text-anchor="start">Operations App</text><text x="430" y="567" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Shows queues, history and</text><text x="430" y="593" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">KPIs. Server forwards rep</text><text x="430" y="619" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">actions.</text><path d="M329,545 L410,545" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="369" y="529" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">review</text><path d="M710,545 L770,545 L770,375 L810,375" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="760" y="595" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">ops key</text><path d="M830,503 C830,479 1140,479 1140,503 L1140,617 C1140,641 830,641 830,617 Z" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.5"/><path d="M830,503 C830,527 1140,527 1140,503" fill="none" stroke="#286CAE" stroke-width="1.5"/><text x="852" y="550" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">Twin: saved memory</text><text x="852" y="583" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">calls + bookings</text><text x="852" y="610" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">State and events per row</text><path d="M982,410 L982,480" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="1103" y="453" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">row reads / writes</text><rect x="1205" y="220" width="170" height="105" rx="10" fill="#F0F3F4" stroke="#53636B" stroke-width="1.4"/><text x="1225" y="250" font-size="23" fill="#53636B" font-weight="700" text-anchor="start">FMCSA</text><text x="1225" y="280" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Authority</text><text x="1225" y="306" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">lookup</text><rect x="1205" y="365" width="170" height="105" rx="10" fill="#F0F3F4" stroke="#53636B" stroke-width="1.4"/><text x="1225" y="395" font-size="23" fill="#53636B" font-weight="700" text-anchor="start">Email</text><text x="1225" y="425" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Code to</text><text x="1225" y="451" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">demo inbox</text><rect x="1205" y="510" width="170" height="120" rx="10" fill="#F0F3F4" stroke="#53636B" stroke-width="1.4"/><text x="1225" y="540" font-size="23" fill="#53636B" font-weight="700" text-anchor="start">Legacy</text><text x="1225" y="571.05" font-size="23" fill="#53636B" font-weight="700" text-anchor="start">TMS</text><text x="1225" y="600" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Search, detail,</text><text x="1225" y="626" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">booking send</text><path d="M1170,260 L1205,260" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><path d="M1170,325 L1188,325 L1188,415 L1205,415" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><path d="M1170,380 L1182,380 L1182,560 L1205,560" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="64" y="690" font-size="15" fill="#526770" font-weight="700" text-anchor="start">WHO OWNS WHICH TRUTH?</text><path d="M64,719 L64,805" fill="none" stroke="#7150A3" stroke-width="1.6"/><text x="82" y="739" font-size="21" fill="#7150A3" font-weight="700" text-anchor="start">Conversation: voice model</text><text x="82" y="767" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">The model phrases a safe result. It does not</text><text x="82" y="792" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">authorize a rate.</text><path d="M515,719 L515,805" fill="none" stroke="#087F78" stroke-width="1.6"/><text x="533" y="739" font-size="21" fill="#087F78" font-weight="700" text-anchor="start">Our decisions: service + Twin</text><text x="533" y="767" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">The service decides; Twin remembers the</text><text x="533" y="792" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">decision.</text><path d="M966,719 L966,805" fill="none" stroke="#53636B" stroke-width="1.6"/><text x="984" y="739" font-size="21" fill="#53636B" font-weight="700" text-anchor="start">Freight and receipts: TMS</text><text x="984" y="767" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">A local agreement does not prove an external</text><text x="984" y="792" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">booking.</text><text x="64" y="862" font-size="18" fill="#526770" font-weight="400" text-anchor="start">Boundary: separate agent and ops credentials enter the service. External credentials stay server-side.</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">01</text></svg>