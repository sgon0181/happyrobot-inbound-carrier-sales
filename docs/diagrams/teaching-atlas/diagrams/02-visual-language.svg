<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">Different shapes mean different things.</title><desc id="desc">Read left to right for data flow. Read numbered steps for the caller journey.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  THE SYSTEM, EXPLAINED</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">Different shapes mean different things.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">Read left to right for data flow. Read numbered steps for the caller journey.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><rect x="64" y="221" width="300" height="100" rx="50.0" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><text x="214.0" y="256" font-size="23" fill="#B46217" font-weight="700" text-anchor="middle">A person</text><text x="214.0" y="285" font-size="18" fill="#18333D" font-weight="400" text-anchor="middle">Speaks or approves.</text><rect x="400" y="221" width="300" height="110" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="420" y="251" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">A process</text><text x="420" y="281" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Transforms input into output.</text><path d="M736,233 C736,209 1036,209 1036,233 L1036,317 C1036,341 736,341 736,317 Z" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.5"/><path d="M736,233 C736,257 1036,257 1036,233" fill="none" stroke="#286CAE" stroke-width="1.5"/><text x="758" y="280" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">Saved state</text><text x="758" y="313" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Survives a service restart.</text><path d="M1222.0,211 L1352,273.5 L1222.0,336 L1092,273.5 Z" fill="#E9F5F1" stroke="#087F78" stroke-width="1.7"/><text x="1222.0" y="268.5" font-size="20" fill="#087F78" font-weight="700" text-anchor="middle">Decision</text><text x="1222.0" y="293.5" font-size="20" fill="#087F78" font-weight="700" text-anchor="middle">yes / no</text><text x="64" y="390" font-size="15" fill="#526770" font-weight="700" text-anchor="start">FROM A REQUEST TO AN APPROVED PITCH</text><rect x="64" y="429" width="292" height="120" rx="10" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><text x="84" y="459" font-size="23" fill="#B46217" font-weight="700" text-anchor="start">Speech</text><text x="84" y="489" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">&quot;Dry van, TX to GA&quot;</text><path d="M356,489 L394,489" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="400" y="429" width="292" height="120" rx="10" fill="#F1ECF8" stroke="#7150A3" stroke-width="1.4"/><text x="420" y="459" font-size="23" fill="#7150A3" font-weight="700" text-anchor="start">Request</text><text x="420" y="489" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">equipment: &quot;dry van&quot;</text><path d="M692,489 L730,489" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="736" y="429" width="292" height="120" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="756" y="459" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Typed object</text><text x="756" y="489" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Search(DRY_VAN, TX, GA)</text><path d="M1028,489 L1066,489" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="1072" y="429" width="292" height="120" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="1092" y="459" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Public reply</text><text x="1092" y="489" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">DEMO01, offer: 1900</text><path d="M64,638 C64,614 454,614 454,638 L454,767 C454,791 64,791 64,767 Z" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.5"/><path d="M64,638 C64,662 454,662 454,638" fill="none" stroke="#286CAE" stroke-width="1.5"/><text x="86" y="685" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">Persistent row</text><text x="86" y="718" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">id + version + data</text><text x="86" y="745" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Example: calls[run_id]</text><rect x="526" y="620" width="390" height="165" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="546" y="650" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Temporary computation</text><text x="546" y="680" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Load, Terms and Step exist while code</text><text x="546" y="706" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">handles the request.</text><rect x="988" y="620" width="388" height="165" rx="10" fill="#F0F3F4" stroke="#53636B" stroke-width="1.4"/><text x="1008" y="650" font-size="23" fill="#53636B" font-weight="700" text-anchor="start">A file is instructions</text><text x="1008" y="680" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">selling.py orchestrates work.</text><text x="1008" y="706" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">It is not a database or a call step.</text><text x="64" y="844" font-size="18" fill="#526770" font-weight="400" text-anchor="start">Color names the owner: PERSON / VOICE / SERVICE / TWIN / EXTERNAL. Labels carry the same meaning.</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">02</text></svg>