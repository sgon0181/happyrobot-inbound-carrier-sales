<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">Follow Maria: earn permission to see loads.</title><desc id="desc">The conversation is the spine. Each row connects a spoken moment to code and stored evidence.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  FOLLOW MARIA</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">Follow Maria: earn permission to see loads.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">The conversation is the spine. Each row connects a spoken moment to code and stored evidence.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="217" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">SERVICE + FILES</text><text x="545" y="217" font-size="15" fill="#B46217" font-weight="700" text-anchor="start">YOU SAY / YOU HEAR</text><text x="1010" y="217" font-size="15" fill="#286CAE" font-weight="700" text-anchor="start">WHAT CHANGES</text><path d="M715,240 L715,815" fill="none" stroke="#B46217" stroke-width="1.6"/><rect x="64" y="245" width="383" height="122" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="84" y="275" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Check carrier authority</text><text x="84" y="305" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">calls.py -&gt; carrier_policy.py</text><text x="84" y="331" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">-&gt; fmcsa.py</text><rect x="510" y="245" width="410" height="122" rx="22" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><circle cx="510" cy="260" r="20" fill="#B46217"/><text x="510" y="267" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="540" y="277" font-size="20" fill="#B46217" font-weight="700" text-anchor="start">&quot;My MC is 1234567.&quot;</text><text x="540" y="323" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">&quot;Atlas Demo Transport, correct?&quot;</text><rect x="983" y="245" width="393" height="122" rx="10" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.4"/><text x="1003" y="275" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">Saved / returned</text><text x="1003" y="305" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">MC + lookup generation saved before</text><text x="1003" y="331" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">lookup; eligibility recorded.</text><path d="M510,306 L452,306" fill="none" stroke="#B46217" stroke-width="2" marker-end="url(#arrow-person)"/><path d="M447,350 L480,350 L480,384 L953,384 L953,306 L978,306" fill="none" stroke="#286CAE" stroke-width="2" marker-end="url(#arrow-twin)"/><rect x="64" y="390" width="383" height="122" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="84" y="420" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Issue and email a code</text><text x="84" y="450" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">calls.py -&gt; codes.py</text><text x="84" y="476" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">-&gt; email.py</text><rect x="510" y="390" width="410" height="122" rx="22" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><circle cx="510" cy="405" r="20" fill="#B46217"/><text x="510" y="412" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="540" y="422" font-size="20" fill="#B46217" font-weight="700" text-anchor="start">&quot;Yes, that is our company.&quot;</text><text x="540" y="468" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">&quot;I sent a code to the demo inbox.&quot;</text><rect x="983" y="390" width="393" height="122" rx="10" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.4"/><text x="1003" y="420" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">Saved / returned</text><text x="1003" y="450" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Hash, expiry and send budget saved.</text><text x="1003" y="476" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Expected code stays private.</text><path d="M510,451 L452,451" fill="none" stroke="#B46217" stroke-width="2" marker-end="url(#arrow-person)"/><path d="M447,495 L480,495 L480,529 L953,529 L953,451 L978,451" fill="none" stroke="#286CAE" stroke-width="2" marker-end="url(#arrow-twin)"/><rect x="64" y="535" width="383" height="122" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="84" y="565" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Consume the code once</text><text x="84" y="595" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">calls.py -&gt; codes.check</text><text x="84" y="621" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">-&gt; CallRows.step</text><rect x="510" y="535" width="410" height="122" rx="22" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><circle cx="510" cy="550" r="20" fill="#B46217"/><text x="510" y="557" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="540" y="567" font-size="20" fill="#B46217" font-weight="700" text-anchor="start">&quot;Here is the six-digit code.&quot;</text><text x="540" y="613" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">&quot;That code passed.&quot;</text><rect x="983" y="535" width="393" height="122" rx="10" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.4"/><text x="1003" y="565" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">Saved / returned</text><text x="1003" y="595" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Code consumed + verified_at saved in</text><text x="1003" y="621" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">the same row write.</text><path d="M510,596 L452,596" fill="none" stroke="#B46217" stroke-width="2" marker-end="url(#arrow-person)"/><path d="M447,640 L480,640 L480,674 L953,674 L953,596 L978,596" fill="none" stroke="#286CAE" stroke-width="2" marker-end="url(#arrow-twin)"/><rect x="64" y="680" width="383" height="122" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="84" y="710" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Find and safely price freight</text><text x="84" y="740" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">selling.py -&gt; loads.py</text><text x="84" y="766" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">-&gt; TMS client + pricing.py</text><rect x="510" y="680" width="410" height="122" rx="22" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><circle cx="510" cy="695" r="20" fill="#B46217"/><text x="510" y="702" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="540" y="712" font-size="20" fill="#B46217" font-weight="700" text-anchor="start">&quot;Dry van, Texas to Georgia.&quot;</text><text x="540" y="758" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">&quot;I have DEMO01. I can offer 1900.&quot;</text><rect x="983" y="680" width="393" height="122" rx="10" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.4"/><text x="1003" y="710" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">Saved / returned</text><text x="1003" y="740" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Search + pitched load details + offer</text><text x="1003" y="766" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">saved; no ceiling returned.</text><path d="M510,741 L452,741" fill="none" stroke="#B46217" stroke-width="2" marker-end="url(#arrow-person)"/><path d="M447,785 L480,785 L480,819 L953,819 L953,741 L978,741" fill="none" stroke="#286CAE" stroke-width="2" marker-end="url(#arrow-twin)"/><text x="64" y="865" font-size="18" fill="#526770" font-weight="400" text-anchor="start">All names, identifiers, load details and dialogue in this teaching call are fixtures, not live records.</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">03</text></svg>