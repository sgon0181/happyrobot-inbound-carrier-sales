<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">Follow Maria: agreement, then human review.</title><desc id="desc">The carrier can agree to a rate. A separate representative controls the external booking send.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  FOLLOW MARIA</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">Follow Maria: agreement, then human review.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">The carrier can agree to a rate. A separate representative controls the external booking send.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="217" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">SERVICE + FILES</text><text x="545" y="217" font-size="15" fill="#B46217" font-weight="700" text-anchor="start">YOU SAY / YOU HEAR</text><text x="1010" y="217" font-size="15" fill="#286CAE" font-weight="700" text-anchor="start">WHAT CHANGES</text><path d="M715,240 L715,815" fill="none" stroke="#B46217" stroke-width="1.6"/><rect x="64" y="245" width="383" height="122" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="84" y="275" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Compute the next offer</text><text x="84" y="305" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">selling.py -&gt; sale_decisions.py</text><text x="84" y="331" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">-&gt; negotiation.respond</text><rect x="510" y="245" width="410" height="122" rx="22" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><circle cx="510" cy="260" r="20" fill="#B46217"/><text x="510" y="267" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text><text x="540" y="277" font-size="20" fill="#B46217" font-weight="700" text-anchor="start">&quot;I need 3000.&quot;</text><text x="540" y="323" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">&quot;I can offer 2025. Does that work?&quot;</text><rect x="983" y="245" width="393" height="122" rx="10" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.4"/><text x="1003" y="275" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">Saved / returned</text><text x="1003" y="305" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">rounds: 0 -&gt; 1</text><text x="1003" y="331" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">last_counter + offer: 2025</text><path d="M510,306 L452,306" fill="none" stroke="#B46217" stroke-width="2" marker-end="url(#arrow-person)"/><path d="M447,350 L480,350 L480,384 L953,384 L953,306 L978,306" fill="none" stroke="#286CAE" stroke-width="2" marker-end="url(#arrow-twin)"/><rect x="64" y="390" width="383" height="122" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="84" y="420" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Claim, reserve and settle</text><text x="84" y="450" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">sale_decisions.py</text><text x="84" y="476" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">-&gt; bookings.py -&gt; settle</text><rect x="510" y="390" width="410" height="122" rx="22" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><circle cx="510" cy="405" r="20" fill="#B46217"/><text x="510" y="412" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text><text x="540" y="422" font-size="20" fill="#B46217" font-weight="700" text-anchor="start">&quot;Yes, 2025 works.&quot;</text><text x="540" y="468" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">&quot;Agreed on DEMO01 at 2025.&quot;</text><rect x="983" y="390" width="393" height="122" rx="10" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.4"/><text x="1003" y="420" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">Saved / returned</text><text x="1003" y="450" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">accepting claim -&gt; RESERVED booking</text><text x="1003" y="476" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">-&gt; call agreement</text><path d="M510,451 L452,451" fill="none" stroke="#B46217" stroke-width="2" marker-end="url(#arrow-person)"/><path d="M447,495 L480,495 L480,529 L953,529 L953,451 L978,451" fill="none" stroke="#286CAE" stroke-width="2" marker-end="url(#arrow-twin)"/><rect x="64" y="535" width="383" height="122" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="84" y="565" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Record a truthful close</text><text x="84" y="595" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">selling.py close + V4 workflow</text><text x="84" y="621" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Calls.end after agent finishes</text><rect x="510" y="535" width="410" height="122" rx="22" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><circle cx="510" cy="550" r="20" fill="#B46217"/><text x="510" y="557" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text><text x="540" y="567" font-size="20" fill="#B46217" font-weight="700" text-anchor="start">&quot;Thank you.&quot;</text><text x="540" y="613" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">&quot;A senior rep will confirm.&quot;</text><rect x="983" y="535" width="393" height="122" rx="10" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.4"/><text x="1003" y="565" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">Saved / returned</text><text x="1003" y="595" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Summary/closed_at differs from end</text><text x="1003" y="621" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">metadata. Reservation remains.</text><path d="M510,596 L452,596" fill="none" stroke="#B46217" stroke-width="2" marker-end="url(#arrow-person)"/><path d="M447,640 L480,640 L480,674 L953,674 L953,596 L978,596" fill="none" stroke="#286CAE" stroke-width="2" marker-end="url(#arrow-twin)"/><rect x="64" y="680" width="383" height="122" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="84" y="710" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Rep Confirm, if sends enabled</text><text x="84" y="740" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">rep_actions.py -&gt; LOAD_GET</text><text x="84" y="766" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">-&gt; intent -&gt; one LOAD_BOOK</text><rect x="510" y="680" width="410" height="122" rx="22" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><circle cx="510" cy="695" r="20" fill="#B46217"/><text x="510" y="702" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">8</text><text x="540" y="712" font-size="20" fill="#B46217" font-weight="700" text-anchor="start">Rep reviews the agreement.</text><text x="540" y="758" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">App: &quot;PENDING acknowledged.&quot;</text><rect x="983" y="680" width="393" height="122" rx="10" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.4"/><text x="1003" y="710" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">Saved / returned</text><text x="1003" y="740" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Valid PENDING receipt -&gt;</text><text x="1003" y="766" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">ACK_PENDING. This is not</text><text x="1003" y="792" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">CONFIRMED.</text><path d="M510,741 L452,741" fill="none" stroke="#B46217" stroke-width="2" marker-end="url(#arrow-person)"/><path d="M447,785 L480,785 L480,819 L953,819 L953,741 L978,741" fill="none" stroke="#286CAE" stroke-width="2" marker-end="url(#arrow-twin)"/><text x="64" y="865" font-size="18" fill="#526770" font-weight="400" text-anchor="start">All names, identifiers, load details and dialogue in this teaching call are fixtures, not live records.</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">04</text></svg>