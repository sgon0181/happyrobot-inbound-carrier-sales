<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">Order matters: verify before any TMS read.</title><desc id="desc">Each arrow is an exchange. Dashed arrows are replies. Storage is a participant, not a footnote.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  WHO TALKS TO WHOM</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">Order matters: verify before any TMS read.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">Each arrow is an exchange. Dashed arrows are replies. Storage is a participant, not a footnote.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><rect x="25" y="204" width="170" height="52" rx="10" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><text x="110" y="237" font-size="18" fill="#B46217" font-weight="700" text-anchor="middle">Maria</text><path d="M110,260 L110,855" fill="none" stroke="#C9D6D9" stroke-width="1.6" stroke-dasharray="5 5"/><rect x="280" y="204" width="170" height="52" rx="10" fill="#F1ECF8" stroke="#7150A3" stroke-width="1.4"/><text x="365" y="237" font-size="18" fill="#7150A3" font-weight="700" text-anchor="middle">Voice workflow</text><path d="M365,260 L365,855" fill="none" stroke="#C9D6D9" stroke-width="1.6" stroke-dasharray="5 5"/><rect x="550" y="204" width="170" height="52" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="635" y="237" font-size="18" fill="#087F78" font-weight="700" text-anchor="middle">Service</text><path d="M635,260 L635,855" fill="none" stroke="#C9D6D9" stroke-width="1.6" stroke-dasharray="5 5"/><rect x="815" y="204" width="170" height="52" rx="10" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.4"/><text x="900" y="237" font-size="18" fill="#286CAE" font-weight="700" text-anchor="middle">Twin</text><path d="M900,260 L900,855" fill="none" stroke="#C9D6D9" stroke-width="1.6" stroke-dasharray="5 5"/><rect x="1195" y="204" width="170" height="52" rx="10" fill="#F0F3F4" stroke="#53636B" stroke-width="1.4"/><text x="1280" y="237" font-size="18" fill="#53636B" font-weight="700" text-anchor="middle">External systems</text><path d="M1280,260 L1280,855" fill="none" stroke="#C9D6D9" stroke-width="1.6" stroke-dasharray="5 5"/><path d="M110,293 L365,293" fill="none" stroke="#B46217" stroke-width="2" marker-end="url(#arrow-person)"/><text x="237.5" y="283" font-size="16" fill="#B46217" font-weight="400" text-anchor="middle">1. MC number</text><path d="M365,330 L635,330" fill="none" stroke="#7150A3" stroke-width="2" marker-end="url(#arrow-voice)"/><text x="500.0" y="320" font-size="16" fill="#7150A3" font-weight="400" text-anchor="middle">verify_carrier + run_id</text><path d="M635,367 L900,367" fill="none" stroke="#286CAE" stroke-width="2" marker-end="url(#arrow-twin)"/><text x="767.5" y="357" font-size="16" fill="#286CAE" font-weight="400" text-anchor="middle">Save MC + generation</text><path d="M635,404 L1280,404" fill="none" stroke="#53636B" stroke-width="2" marker-end="url(#arrow-ext)"/><text x="957.5" y="394" font-size="16" fill="#53636B" font-weight="400" text-anchor="middle">FMCSA lookup</text><path d="M1280,441 L635,441" fill="none" stroke="#53636B" stroke-width="2" marker-end="url(#arrow-ext)" stroke-dasharray="6 5"/><text x="957.5" y="431" font-size="16" fill="#53636B" font-weight="400" text-anchor="middle">Carrier authority records</text><path d="M635,478 L900,478" fill="none" stroke="#286CAE" stroke-width="2" marker-end="url(#arrow-twin)"/><text x="767.5" y="468" font-size="16" fill="#286CAE" font-weight="400" text-anchor="middle">Save authority decision</text><path d="M635,515 L365,515" fill="none" stroke="#087F78" stroke-width="2" marker-end="url(#arrow-service)" stroke-dasharray="6 5"/><text x="500.0" y="505" font-size="16" fill="#087F78" font-weight="400" text-anchor="middle">Eligible + company name</text><path d="M365,552 L635,552" fill="none" stroke="#7150A3" stroke-width="2" marker-end="url(#arrow-voice)"/><text x="500.0" y="542" font-size="16" fill="#7150A3" font-weight="400" text-anchor="middle">2. send_code, after name check</text><path d="M635,589 L900,589" fill="none" stroke="#286CAE" stroke-width="2" marker-end="url(#arrow-twin)"/><text x="767.5" y="579" font-size="16" fill="#286CAE" font-weight="400" text-anchor="middle">Save hash + consume send</text><path d="M635,626 L1280,626" fill="none" stroke="#53636B" stroke-width="2" marker-end="url(#arrow-ext)"/><text x="957.5" y="616" font-size="16" fill="#53636B" font-weight="400" text-anchor="middle">SMTP email to fixed inbox</text><path d="M1280,663 L110,663" fill="none" stroke="#53636B" stroke-width="2" marker-end="url(#arrow-ext)" stroke-dasharray="6 5"/><text x="695.0" y="653" font-size="16" fill="#53636B" font-weight="400" text-anchor="middle">Maria retrieves the emailed digits</text><path d="M365,700 L635,700" fill="none" stroke="#7150A3" stroke-width="2" marker-end="url(#arrow-voice)"/><text x="500.0" y="690" font-size="16" fill="#7150A3" font-weight="400" text-anchor="middle">3. verify_code, spoken digits</text><path d="M635,737 L900,737" fill="none" stroke="#286CAE" stroke-width="2" marker-end="url(#arrow-twin)"/><text x="767.5" y="727" font-size="16" fill="#286CAE" font-weight="400" text-anchor="middle">Consume code + verified_at</text><path d="M635,774 L365,774" fill="none" stroke="#087F78" stroke-width="2" marker-end="url(#arrow-service)" stroke-dasharray="6 5"/><text x="500.0" y="764" font-size="16" fill="#087F78" font-weight="400" text-anchor="middle">Code passed</text><path d="M365,811 L635,811" fill="none" stroke="#7150A3" stroke-width="2" marker-end="url(#arrow-voice)"/><text x="500.0" y="801" font-size="16" fill="#7150A3" font-weight="400" text-anchor="middle">4. find_loads, after code passes</text><path d="M635,848 L1280,848" fill="none" stroke="#53636B" stroke-width="2" marker-end="url(#arrow-ext)"/><text x="957.5" y="838" font-size="16" fill="#53636B" font-weight="400" text-anchor="middle">Only now: LOAD_QUERY / LOAD_GET</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">05</text></svg>