<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">Two checks answer two different questions.</title><desc id="desc">Authority asks whether the carrier may operate. The demo code proves access to a configured inbox.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  INSIDE STEPS 1 TO 3</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">Two checks answer two different questions.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">Authority asks whether the carrier may operate. The demo code proves access to a configured inbox.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><rect x="64" y="218" width="346" height="126" rx="10" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><text x="84" y="248" font-size="23" fill="#B46217" font-weight="700" text-anchor="start">Input: MC text</text><text x="84" y="278" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">&quot;MC-1234567&quot; -&gt; &quot;1234567&quot;</text><text x="84" y="304" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Malformed input stops here.</text><path d="M410,281 L465,281" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="440" y="205" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">normalize</text><rect x="470" y="218" width="406" height="126" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="490" y="248" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Save before external lookup</text><text x="490" y="278" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Clear old verification on MC change.</text><text x="490" y="304" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Increment lookup generation.</text><path d="M876,281 L930,281" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="935" y="218" width="440" height="126" rx="10" fill="#F0F3F4" stroke="#53636B" stroke-width="1.4"/><text x="955" y="248" font-size="23" fill="#53636B" font-weight="700" text-anchor="start">FMCSA: positive evidence</text><text x="955" y="278" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Registration active + authority active + allowed</text><text x="955" y="304" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">to operate + no out-of-service flag.</text><text x="64" y="395" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">LATE LOOKUP RULE</text><text x="64" y="431" font-size="26" fill="#18333D" font-weight="700" text-anchor="start">A response applies only to the current lookup generation.</text><text x="64" y="466" font-size="20" fill="#526770" font-weight="400" text-anchor="start">Changing the MC cannot preserve an earlier carrier&#x27;s code-passed state or reset budgets.</text><rect x="64" y="515" width="380" height="178" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="84" y="545" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Issue the challenge</text><text x="84" y="575" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Generate six digits. Store keyed hash +</text><text x="84" y="601" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">expiry, then email.</text><text x="84" y="627" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Destination comes from settings.</text><path d="M444,605 L493,605" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="64" y="497" font-size="18" fill="#B46217" font-weight="400" text-anchor="start">Maria retrieves the email and reads the digits aloud; the workflow submits them to the service.</text><rect x="498" y="515" width="390" height="178" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="518" y="545" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Check the challenge</text><text x="518" y="575" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Normalize digits; compare hash.</text><text x="518" y="601" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">One write consumes code and marks</text><text x="518" y="627" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">the call code-passed.</text><path d="M888,605 L938,605" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><path d="M943,533 C943,509 1376,509 1376,533 L1376,675 C1376,699 943,699 943,675 Z" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.5"/><path d="M943,533 C943,557 1376,557 1376,533" fill="none" stroke="#286CAE" stroke-width="1.5"/><text x="965" y="580" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">calls[run_id]</text><text x="965" y="613" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">otp: hash, expiry, sends, failed</text><text x="965" y="640" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">verified_at + structured event</text><path d="M64,744 L64,830" fill="none" stroke="#087F78" stroke-width="1.6"/><text x="82" y="764" font-size="21" fill="#087F78" font-weight="700" text-anchor="start">5 minutes</text><text x="82" y="792" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">The issued code expires. Expired is not verified.</text><path d="M515,744 L515,830" fill="none" stroke="#087F78" stroke-width="1.6"/><text x="533" y="764" font-size="21" fill="#087F78" font-weight="700" text-anchor="start">2 sends, 3 failed tries</text><text x="533" y="792" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Resends and MC changes preserve the call</text><text x="533" y="817" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">budgets.</text><path d="M966,744 L966,830" fill="none" stroke="#B44940" stroke-width="1.6"/><text x="984" y="764" font-size="21" fill="#B44940" font-weight="700" text-anchor="start">Code passed, not identity proven</text><text x="984" y="792" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">A shared demo inbox does not bind a human to</text><text x="984" y="817" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">an MC.</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">07</text></svg>