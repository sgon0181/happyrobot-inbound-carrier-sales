<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">A search result is only a candidate.</title><desc id="desc">The backend filters summaries, fetches full details, rechecks them, then exposes an approved pitch.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  INSIDE STEP 4</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">A search result is only a candidate.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">The backend filters summaries, fetches full details, rechecks them, then exposes an approved pitch.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><rect x="64" y="225" width="292" height="175" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="84" y="255" font-size="13" fill="#087F78" font-weight="700" text-anchor="start">1</text><text x="84" y="285" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Normalize the request</text><text x="84" y="315" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">&quot;dry van&quot;, &quot;tx&quot;, &quot;ga&quot;</text><text x="84" y="341" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">-&gt; DRY_VAN / TX / GA</text><path d="M356,313 L394,313" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="400" y="225" width="292" height="175" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="420" y="255" font-size="13" fill="#087F78" font-weight="700" text-anchor="start">2</text><text x="420" y="285" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Permission gate</text><text x="420" y="315" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">eligible AND verified_at</text><text x="420" y="341" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Otherwise: no TMS request.</text><path d="M692,313 L730,313" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="736" y="225" width="292" height="175" rx="10" fill="#F0F3F4" stroke="#53636B" stroke-width="1.4"/><text x="756" y="255" font-size="13" fill="#53636B" font-weight="700" text-anchor="start">3</text><text x="756" y="285" font-size="23" fill="#53636B" font-weight="700" text-anchor="start">Query and select</text><text x="756" y="315" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">LOAD_QUERY, up to 50.</text><text x="756" y="341" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">OPEN, future, matching, free.</text><path d="M1028,313 L1066,313" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="1072" y="225" width="292" height="175" rx="10" fill="#F0F3F4" stroke="#53636B" stroke-width="1.4"/><text x="1092" y="255" font-size="13" fill="#53636B" font-weight="700" text-anchor="start">4</text><text x="1092" y="285" font-size="23" fill="#53636B" font-weight="700" text-anchor="start">Read full details</text><text x="1092" y="315" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">LOAD_GET, up to 3.</text><text x="1092" y="341" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Recheck lane + time +</text><text x="1092" y="367" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">status.</text><path d="M1220,400 L1220,464 L1195,464" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="1280" y="438" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">validated Load</text><rect x="940" y="485" width="436" height="195" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="960" y="515" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Internal Load + Terms</text><text x="960" y="545" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">DEMO01: posted 2000, ceiling 2400</text><text x="960" y="571" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">price_load -&gt; opening 1900</text><text x="960" y="597" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Private values stay backend-only.</text><path d="M940,580 L850,580" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="895" y="563" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">allowlist</text><rect x="472" y="485" width="375" height="195" rx="10" fill="#F1ECF8" stroke="#7150A3" stroke-width="1.4"/><text x="492" y="515" font-size="23" fill="#7150A3" font-weight="700" text-anchor="start">Public pitch</text><text x="492" y="545" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">DEMO01, TX -&gt; GA, DRY_VAN</text><text x="492" y="571" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Pickup / delivery / cargo / notes</text><text x="492" y="597" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">offer: 1900</text><text x="492" y="623" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">No posted rate or ceiling.</text><path d="M472,580 L418,580" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="445" y="563" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">save / speak</text><path d="M64,503 C64,479 414,479 414,503 L414,662 C414,686 64,686 64,662 Z" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.5"/><path d="M64,503 C64,527 414,527 414,503" fill="none" stroke="#286CAE" stroke-width="1.5"/><text x="86" y="550" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">calls[run_id]</text><text x="86" y="583" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Normalized search</text><text x="86" y="610" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Public pitch + approved offer</text><text x="86" y="637" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Event and result</text><path d="M64,747 L64,833" fill="none" stroke="#087F78" stroke-width="1.6"/><text x="82" y="767" font-size="21" fill="#087F78" font-weight="700" text-anchor="start">Recheck before saving</text><text x="82" y="795" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Revalidate the full load and confirm the call is</text><text x="82" y="820" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">still verified.</text><path d="M515,747 L515,833" fill="none" stroke="#B44940" stroke-width="1.6"/><text x="533" y="767" font-size="21" fill="#B44940" font-weight="700" text-anchor="start">Missing ceiling means review</text><text x="533" y="795" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">No guessed ceiling or automated offer.</text><path d="M966,747 L966,833" fill="none" stroke="#53636B" stroke-width="1.6"/><text x="984" y="767" font-size="21" fill="#53636B" font-weight="700" text-anchor="start">Current filters are limited</text><text x="984" y="795" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Equipment and origin/destination state, not city</text><text x="984" y="820" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">or pickup-date input.</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">08</text></svg>