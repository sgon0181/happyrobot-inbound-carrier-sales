<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">The service moves the numbers. The model speaks them.</title><desc id="desc">The same synthetic load and secret reproduce these exact terms under pricing-v1.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  INSIDE STEP 5</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">The service moves the numbers. The model speaks them.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">The same synthetic load and secret reproduce these exact terms under pricing-v1.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="229" font-size="19" fill="#526770" font-weight="400" text-anchor="start">DEMO01  |  posted 2000  |  private ceiling 2400  |  synthetic secret: teaching-only</text><text x="64" y="270" font-size="17" fill="#B44940" font-weight="700" text-anchor="start">PRIVATE TEACHING VIEW: these are invented backend inputs, never a carrier-facing tool response.</text><path d="M110,378 L1310,378" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><circle cx="110.0" cy="378" r="9" fill="#087F78"/><text x="110.0" y="345" font-size="18" fill="#087F78" font-weight="700" text-anchor="middle">Opening</text><text x="110.0" y="420" font-size="26" fill="#18333D" font-weight="700" text-anchor="middle">1900</text><circle cx="410.0" cy="378" r="9" fill="#087F78"/><text x="410.0" y="345" font-size="18" fill="#087F78" font-weight="700" text-anchor="middle">Round 1</text><text x="410.0" y="420" font-size="26" fill="#18333D" font-weight="700" text-anchor="middle">2025</text><circle cx="770.0" cy="378" r="9" fill="#087F78"/><text x="770.0" y="345" font-size="18" fill="#087F78" font-weight="700" text-anchor="middle">Round 2</text><text x="770.0" y="420" font-size="26" fill="#18333D" font-weight="700" text-anchor="middle">2175</text><circle cx="1130.0" cy="378" r="9" fill="#087F78"/><text x="1130.0" y="345" font-size="18" fill="#087F78" font-weight="700" text-anchor="middle">Final / cap</text><text x="1130.0" y="420" font-size="26" fill="#18333D" font-weight="700" text-anchor="middle">2325</text><circle cx="1310.0" cy="378" r="9" fill="#B44940"/><text x="1310.0" y="345" font-size="18" fill="#B44940" font-weight="700" text-anchor="middle">Ceiling</text><text x="1310.0" y="420" font-size="26" fill="#18333D" font-weight="700" text-anchor="middle">2400</text><rect x="64" y="489" width="400" height="160" rx="10" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><text x="84" y="519" font-size="23" fill="#B46217" font-weight="700" text-anchor="start">Maria asks for 3000</text><text x="84" y="549" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">3000 is above the next target.</text><text x="84" y="575" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">respond -&gt; COUNTER 2025</text><text x="84" y="601" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">rounds: 0 -&gt; 1</text><path d="M464,569 L514,569" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="489.0" y="559" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">decision</text><rect x="520" y="489" width="400" height="160" rx="10" fill="#F1ECF8" stroke="#7150A3" stroke-width="1.4"/><text x="540" y="519" font-size="23" fill="#7150A3" font-weight="700" text-anchor="start">The model says 2025</text><text x="540" y="549" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">&quot;I can offer 2025.</text><text x="540" y="575" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Does that work for you?&quot;</text><text x="540" y="601" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Then it waits for Maria.</text><path d="M920,569 L970,569" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="945.0" y="559" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">acceptance</text><rect x="976" y="489" width="400" height="160" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="996" y="519" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Maria accepts 2025</text><text x="996" y="549" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Call negotiate again at 2025.</text><text x="996" y="575" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">At current offer -&gt; ACCEPT.</text><text x="996" y="601" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Round count remains 1.</text><path d="M64,716 L64,802" fill="none" stroke="#087F78" stroke-width="1.6"/><text x="82" y="736" font-size="21" fill="#087F78" font-weight="700" text-anchor="start">One budget across the call</text><text x="82" y="764" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Changing loads or MC does not create three</text><text x="82" y="789" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">new rounds.</text><path d="M515,716 L515,802" fill="none" stroke="#087F78" stroke-width="1.6"/><text x="533" y="736" font-size="21" fill="#087F78" font-weight="700" text-anchor="start">No invented rounding</text><text x="533" y="764" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Unclear or fractional ask -&gt; ask_again, with no</text><text x="533" y="789" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">round consumed.</text><path d="M966,716 L966,802" fill="none" stroke="#B44940" stroke-width="1.6"/><text x="984" y="736" font-size="21" fill="#B44940" font-weight="700" text-anchor="start">After the final offer</text><text x="984" y="764" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Acceptance still works. A higher ask fails without</text><text x="984" y="789" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">transfer.</text><text x="64" y="863" font-size="18" fill="#526770" font-weight="400" text-anchor="start">Amounts use assumed whole native units. Currency and upstream scale remain unresolved contract questions.</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">09</text></svg>