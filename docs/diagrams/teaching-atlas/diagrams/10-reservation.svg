<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">An agreement crosses three durable writes.</title><desc id="desc">Twin gives single-row atomic writes. The call and booking rows are not one transaction.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  INSIDE STEP 6</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">An agreement crosses three durable writes.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">Twin gives single-row atomic writes. The call and booking rows are not one transaction.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><path d="M64,253 C64,229 464,229 464,253 L464,442 C464,466 64,466 64,442 Z" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.5"/><path d="M64,253 C64,277 464,277 464,253" fill="none" stroke="#286CAE" stroke-width="1.5"/><text x="86" y="300" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">A. Claim the intention</text><text x="86" y="333" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">calls[run_id]</text><text x="86" y="360" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">accepting: claim ID, load, rate</text><text x="86" y="387" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Event: negotiate / accepting</text><path d="M464,350 L514,350" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="489" y="334" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">next</text><path d="M520,253 C520,229 920,229 920,253 L920,442 C920,466 520,466 520,442 Z" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.5"/><path d="M520,253 C520,277 920,277 920,253" fill="none" stroke="#286CAE" stroke-width="1.5"/><text x="542" y="300" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">B. Win the load</text><text x="542" y="333" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">bookings[DEMO01]</text><text x="542" y="360" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">state: RESERVED</text><text x="542" y="387" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Primary key gives one holder.</text><path d="M920,350 L970,350" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="945" y="334" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">next</text><path d="M976,253 C976,229 1376,229 1376,253 L1376,442 C1376,466 976,466 976,442 Z" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.5"/><path d="M976,253 C976,277 1376,277 1376,253" fill="none" stroke="#286CAE" stroke-width="1.5"/><text x="998" y="300" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">C. Settle the call</text><text x="998" y="333" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">calls[run_id]</text><text x="998" y="360" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">agreement: DEMO01 at 2025</text><text x="998" y="387" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Clear matching accepting claim.</text><rect x="64" y="535" width="628" height="147" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="84" y="565" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">If two callers accept the same load</text><text x="84" y="595" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Only one reservation wins. The other receives load_gone and is</text><text x="84" y="621" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">asked whether to search again.</text><rect x="748" y="535" width="628" height="147" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="768" y="565" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">If a request stops between writes</text><text x="768" y="595" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">A retry resolves its claim and reservation. Claim IDs and voids</text><text x="768" y="621" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">prevent delayed requests from taking a load later.</text><path d="M64,738 L64,824" fill="none" stroke="#286CAE" stroke-width="1.6"/><text x="82" y="758" font-size="21" fill="#286CAE" font-weight="700" text-anchor="start">RESERVED is our local hold</text><text x="82" y="786" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">No TMS booking command has been sent.</text><text x="82" y="811" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Others outside our service can still act.</text><path d="M515,738 L515,824" fill="none" stroke="#B46217" stroke-width="1.6"/><text x="533" y="758" font-size="21" fill="#B46217" font-weight="700" text-anchor="start">Closing does not release it</text><text x="533" y="786" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">There is no automatic expiry. A rep must act.</text><path d="M966,738 L966,824" fill="none" stroke="#087F78" stroke-width="1.6"/><text x="984" y="758" font-size="21" fill="#087F78" font-weight="700" text-anchor="start">A file is not the boundary</text><text x="984" y="786" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">selling.py orchestrates; bookings.py owns</text><text x="984" y="811" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">load-level reservation ownership.</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">10</text></svg>