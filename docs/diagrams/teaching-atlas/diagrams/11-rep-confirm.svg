<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">Confirm means: recheck, win intent, send once.</title><desc id="desc">The browser proposes an action. The service verifies every prerequisite before sending.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  INSIDE STEP 8</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">Confirm means: recheck, win intent, send once.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">The browser proposes an action. The service verifies every prerequisite before sending.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><rect x="64" y="229" width="292" height="190" rx="10" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><text x="84" y="259" font-size="23" fill="#B46217" font-weight="700" text-anchor="start">Rep sees version 7</text><text x="84" y="289" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">App verifies the signed-in</text><text x="84" y="315" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">user.</text><text x="84" y="341" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Browser sends only {version:</text><text x="84" y="367" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">7}.</text><path d="M356,324 L394,324" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="400" y="229" width="292" height="190" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="420" y="259" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Service checks</text><text x="420" y="289" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Send mode ON; row</text><text x="420" y="315" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">RESERVED at v7.</text><text x="420" y="341" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Fresh load OPEN, future,</text><text x="420" y="367" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">within ceiling.</text><path d="M692,324 L730,324" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="736" y="229" width="292" height="190" rx="10" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.4"/><text x="756" y="259" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">One winner</text><text x="756" y="289" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Conditional write WHERE</text><text x="756" y="315" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">version=7</text><text x="756" y="341" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">-&gt; v8, SUBMITTING +</text><text x="756" y="367" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">send_id</text><path d="M1028,324 L1066,324" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="1072" y="229" width="292" height="190" rx="10" fill="#F0F3F4" stroke="#53636B" stroke-width="1.4"/><text x="1092" y="259" font-size="23" fill="#53636B" font-weight="700" text-anchor="start">External effect</text><text x="1092" y="289" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">LOAD_BOOK on a fresh</text><text x="1092" y="315" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">connection.</text><text x="1092" y="341" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">No automatic write retry.</text><text x="64" y="486" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">WHY A DOUBLE CLICK CANNOT AUTHORIZE TWO SENDS</text><rect x="64" y="525" width="330" height="132" rx="10" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><text x="84" y="555" font-size="23" fill="#B46217" font-weight="700" text-anchor="start">Rep A reads v7</text><text x="84" y="585" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Requests Confirm(v7).</text><rect x="64" y="705" width="330" height="132" rx="10" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><text x="84" y="735" font-size="23" fill="#B46217" font-weight="700" text-anchor="start">Rep B reads v7</text><text x="84" y="765" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Requests Confirm(v7).</text><path d="M660.0,542 L810,639.5 L660.0,737 L510,639.5 Z" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.7"/><text x="660.0" y="634.5" font-size="20" fill="#286CAE" font-weight="700" text-anchor="middle">Update row</text><text x="660.0" y="659.5" font-size="20" fill="#286CAE" font-weight="700" text-anchor="middle">if version = 7</text><path d="M394,592 L460,592 L460,604 L510,604" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="452.0" y="588" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">A</text><path d="M394,771 L460,771 L460,679 L510,679" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="440" y="732" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">B</text><rect x="920" y="510" width="456" height="125" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="940" y="540" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Winner: v8 / SUBMITTING</text><text x="940" y="570" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">One send permitted by saved intent.</text><rect x="920" y="715" width="456" height="125" rx="10" fill="#FAECE8" stroke="#B44940" stroke-width="1.4"/><text x="940" y="745" font-size="23" fill="#B44940" font-weight="700" text-anchor="start">Loser: stale</text><text x="940" y="775" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Refresh. No LOAD_BOOK from this action.</text><path d="M810,605 L866,605 L866,572 L920,572" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="870" y="551" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">one wins</text><path d="M810,676 L866,676 L866,777 L920,777" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="865" y="701" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">other loses</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">11</text></svg>