<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">Seven visible states, three different kinds of evidence.</title><desc id="desc">A reference with PENDING acknowledges the request. Only a complete BOOKED receipt is confirmation.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  MEMORY AND STATE</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">Seven visible states, three different kinds of evidence.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">A reference with PENDING acknowledges the request. Only a complete BOOKED receipt is confirmation.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><rect x="64" y="230" width="290" height="105" rx="10" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.4"/><text x="84" y="260" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">RESERVED</text><text x="84" y="290" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Agreed locally. Nothing sent.</text><rect x="540" y="230" width="320" height="105" rx="10" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.4"/><text x="560" y="260" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">SUBMITTING</text><text x="560" y="290" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Intent saved; send in flight.</text><path d="M354,283 L540,283" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="447.0" y="273" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">rep Confirm + checks</text><rect x="64" y="495" width="290" height="110" rx="10" fill="#F0F3F4" stroke="#53636B" stroke-width="1.4"/><text x="84" y="525" font-size="23" fill="#53636B" font-weight="700" text-anchor="start">RELEASED</text><text x="84" y="555" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Rep declines; nothing sent.</text><path d="M209,335 L209,495" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="260" y="425" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">decline</text><rect x="540" y="495" width="320" height="110" rx="10" fill="#F0F3F4" stroke="#53636B" stroke-width="1.4"/><text x="560" y="525" font-size="23" fill="#53636B" font-weight="700" text-anchor="start">FAILED</text><text x="560" y="555" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Refused / provably unsent.</text><text x="560" y="581" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Or: pre-send check fails.</text><path d="M354,306 L440,306 L440,548 L540,548" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="441" y="455" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">recheck fails</text><path d="M700,335 L700,495" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="792" y="428" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">refusal / no-send</text><rect x="1020" y="220" width="356" height="117" rx="10" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.4"/><text x="1040" y="250" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">ACK_PENDING</text><text x="1040" y="280" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Matching receipt + reference</text><text x="1040" y="306" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">STATUS: PENDING</text><rect x="1020" y="402" width="356" height="117" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="1040" y="432" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">CONFIRMED</text><text x="1040" y="462" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Matching receipt + reference</text><text x="1040" y="488" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">STATUS: BOOKED</text><rect x="1020" y="584" width="356" height="117" rx="10" fill="#FAECE8" stroke="#B44940" stroke-width="1.4"/><text x="1040" y="614" font-size="23" fill="#B44940" font-weight="700" text-anchor="start">UNKNOWN</text><text x="1040" y="644" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">May have landed.</text><text x="1040" y="670" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Never resend.</text><path d="M860,266 L1020,266" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="940" y="247" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">PENDING</text><path d="M860,288 L935,288 L935,460 L1020,460" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="960" y="383" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">BOOKED</text><path d="M860,310 L900,310 L900,642 L1020,642" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="953" y="564" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">unclear result</text><text x="1020" y="743" font-size="18" fill="#526770" font-weight="400" text-anchor="start">CONFIRMED is implemented and tested.</text><text x="1020" y="767.3" font-size="18" fill="#526770" font-weight="400" text-anchor="start">No recorded live BOOKED receipt exists.</text><path d="M64,758 L64,844" fill="none" stroke="#53636B" stroke-width="1.6"/><text x="82" y="778" font-size="21" fill="#53636B" font-weight="700" text-anchor="start">Free for a new reservation</text><text x="82" y="806" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">FAILED, RELEASED and internal UNCLAIMED.</text><text x="82" y="831" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Prior events survive reuse.</text><path d="M540,758 L540,844" fill="none" stroke="#B44940" stroke-width="1.6"/><text x="558" y="778" font-size="21" fill="#B44940" font-weight="700" text-anchor="start">Every other state blocks offers</text><text x="558" y="806" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Unknown state names also block. No automatic</text><text x="558" y="831" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">expiry or cancellation.</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">12</text></svg>