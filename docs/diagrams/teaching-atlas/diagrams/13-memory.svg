<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">Twin remembers decisions, not the whole conversation.</title><desc id="desc">Both tables have id (text), version (integer), and data (JSONB). Each row carries its own history.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  MEMORY AND STATE</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">Twin remembers decisions, not the whole conversation.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">Both tables have id (text), version (integer), and data (JSONB). Each row carries its own history.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><path d="M64,243 C64,219 694,219 694,243 L694,559 C694,583 64,583 64,559 Z" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.5"/><path d="M64,243 C64,267 694,267 694,243" fill="none" stroke="#286CAE" stroke-width="1.5"/><text x="86" y="290" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">calls[run_id]</text><text x="86" y="323" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">WHO: MC, name, eligibility, code-passed state</text><text x="86" y="350" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">SEARCH: filters, pitched details, approved offers</text><text x="86" y="377" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">NEGOTIATION: rounds, last counter, agreement</text><text x="86" y="404" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">CAPTURE: summary, close time, actual end report</text><text x="86" y="431" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">HISTORY: events[] + policy version</text><path d="M747,243 C747,219 1376,219 1376,243 L1376,559 C1376,583 747,583 747,559 Z" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.5"/><path d="M747,243 C747,267 1376,267 1376,243" fill="none" stroke="#286CAE" stroke-width="1.5"/><text x="769" y="290" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">bookings[load_id]</text><text x="769" y="323" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">OWNERSHIP: call ID, MC, rate, claim ID</text><text x="769" y="350" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">CONTEXT: captured shipment, dates, posted rate</text><text x="769" y="377" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">LIFECYCLE: state, rep, reason</text><text x="769" y="404" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">RECEIPT: status, reference, raw bytes, hash</text><text x="769" y="431" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">HISTORY: events[] from every reservation</text><text x="64" y="627" font-size="15" fill="#286CAE" font-weight="700" text-anchor="start">ONE ROW WRITE</text><rect x="64" y="655" width="380" height="154" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="84" y="685" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Read version 7</text><text x="84" y="715" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Compute new state + new event in</text><text x="84" y="741" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">memory. Decision must be pure.</text><path d="M444,731 L493,731" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="498" y="655" width="400" height="154" rx="10" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.4"/><text x="518" y="685" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">Write if version still 7</text><text x="518" y="715" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Save state and event together.</text><text x="518" y="741" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Success -&gt; version 8.</text><path d="M898,731 L948,731" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="953" y="655" width="423" height="154" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="973" y="685" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Conflict? Read and recompute</text><text x="973" y="715" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">At most five attempts. No multi-row</text><text x="973" y="741" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">transaction and no independent receipt</text><text x="973" y="767" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">journal.</text><text x="64" y="862" font-size="18" fill="#526770" font-weight="400" text-anchor="start">Transcripts stay on HappyRobot. Service events explain decisions; they do not prove every spoken word.</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">13</text></svg>