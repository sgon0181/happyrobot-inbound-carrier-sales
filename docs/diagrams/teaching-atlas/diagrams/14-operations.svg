<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">The App is a window and a control desk.</title><desc id="desc">Its server authenticates the user, fetches the service snapshot and forwards versioned rep actions.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  THE OPERATIONS USER</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">The App is a window and a control desk.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">Its server authenticates the user, fetches the service snapshot and forwards versioned rep actions.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><rect x="64" y="224" width="292" height="170" rx="10" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><text x="84" y="254" font-size="23" fill="#B46217" font-weight="700" text-anchor="start">Rep browser</text><text x="84" y="284" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Displays status.</text><text x="84" y="310" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">No ops key, Twin or TMS</text><text x="84" y="336" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">access.</text><path d="M356,309 L394,309" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="400" y="224" width="292" height="170" rx="10" fill="#F1ECF8" stroke="#7150A3" stroke-width="1.4"/><text x="420" y="254" font-size="23" fill="#7150A3" font-weight="700" text-anchor="start">Next.js server</text><text x="420" y="284" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Checks platform session.</text><text x="420" y="310" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Uses server-only</text><text x="420" y="336" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">OPS_API_KEY.</text><path d="M692,309 L730,309" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="736" y="224" width="292" height="170" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="756" y="254" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Service dashboard</text><text x="756" y="284" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Two table reads; 5-second</text><text x="756" y="310" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">cache.</text><text x="756" y="336" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Projects records and KPIs.</text><path d="M1028,309 L1066,309" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="1072" y="224" width="292" height="170" rx="10" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.4"/><text x="1092" y="254" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">Twin</text><text x="1092" y="284" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">calls + bookings</text><text x="1092" y="310" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Real and synthetic cohorts.</text><text x="64" y="448" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">WHAT THE SNAPSHOT BECOMES</text><rect x="64" y="485" width="410" height="142" rx="10" fill="#FFF2DF" stroke="#B46217" stroke-width="1.4"/><text x="84" y="515" font-size="23" fill="#B46217" font-weight="700" text-anchor="start">Rep queue</text><text x="84" y="545" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">RESERVED -&gt; Confirm / Decline</text><text x="84" y="571" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Pending or unknown -&gt; Reconcile</text><rect x="515" y="485" width="410" height="142" rx="10" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.4"/><text x="535" y="515" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">Call history</text><text x="535" y="545" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">MC, pitched loads, every counter,</text><text x="535" y="571" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">notes and captured end metadata</text><rect x="966" y="485" width="410" height="142" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="986" y="515" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Demand and cohorts</text><text x="986" y="545" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Latest no-match lanes.</text><text x="986" y="571" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Synthetic calls shown separately.</text><rect x="64" y="679" width="820" height="155" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="86" y="714" font-size="14" fill="#087F78" font-weight="700" text-anchor="start">NORTHSTAR</text><text x="86" y="756" font-size="27" fill="#087F78" font-weight="700" text-anchor="start">Recorded reservations / calls ever passing code</text><text x="86" y="793" font-size="18" fill="#526770" font-weight="400" text-anchor="start">Real cohort only. This is not final booking conversion or business profit.</text><rect x="934" y="679" width="442" height="155" rx="10" fill="#FAECE8" stroke="#B44940" stroke-width="1.4"/><text x="954" y="709" font-size="23" fill="#B44940" font-weight="700" text-anchor="start">Unsaved receipt safety net</text><text x="954" y="739" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Browser stores returned evidence for Copy /</text><text x="954" y="765" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Download. Preserve it; never resend.</text><text x="64" y="866" font-size="18" fill="#526770" font-weight="400" text-anchor="start">Refresh: every 15 seconds while visible. Missing or OFF send mode disables Confirm; service enforces it too.</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">14</text></svg>