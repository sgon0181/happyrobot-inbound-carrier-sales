<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">A safe failure tells the truth and preserves evidence.</title><desc id="desc">These branches come from implemented code and tests. The main journey stays uncluttered.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  WHEN THINGS GO WRONG</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">A safe failure tells the truth and preserves evidence.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">These branches come from implemented code and tests. The main journey stays uncluttered.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="218" font-size="14" fill="#526770" font-weight="700" text-anchor="start">TRIGGER</text><text x="360" y="218" font-size="14" fill="#526770" font-weight="700" text-anchor="start">SERVICE RESULT</text><text x="695" y="218" font-size="14" fill="#526770" font-weight="700" text-anchor="start">WHAT REMAINS</text><text x="1030" y="218" font-size="14" fill="#526770" font-weight="700" text-anchor="start">NEXT HUMAN ACTION</text><path d="M64,336 L1376,336" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="273" font-size="18" fill="#B44940" font-weight="700" text-anchor="start">Authority / code fails</text><text x="360" y="273" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">No load details.</text><text x="360" y="298" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Unavailable is not ineligible.</text><text x="695" y="273" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Call decision + budgets;</text><text x="695" y="298" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">expected code remains private.</text><text x="1030" y="273" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Correct MC / repeat allowed</text><text x="1030" y="298" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">step / end truthfully.</text><path d="M332,288 L350,288" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><path d="M64,435 L1376,435" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="372" font-size="18" fill="#B44940" font-weight="700" text-anchor="start">TMS read unavailable</text><text x="360" y="372" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Bounded read retries,</text><text x="360" y="397" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">then tms_unavailable.</text><text x="695" y="372" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Recorded search / failure.</text><text x="695" y="397" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">No invented load offer.</text><text x="1030" y="372" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Retry later; do not pitch</text><text x="1030" y="397" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">stale cached freight.</text><path d="M332,387 L350,387" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><path d="M64,534 L1376,534" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="471" font-size="18" fill="#B44940" font-weight="700" text-anchor="start">Load lost on acceptance</text><text x="360" y="471" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">load_gone; remove old offer.</text><text x="360" y="496" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Ask permission to search.</text><text x="695" y="471" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Prior structured events;</text><text x="695" y="496" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">transcript stays on platform.</text><text x="1030" y="471" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Agree to a fresh search.</text><text x="1030" y="496" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Do not invent a cause.</text><path d="M332,486 L350,486" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><path d="M64,633 L1376,633" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="570" font-size="18" fill="#B44940" font-weight="700" text-anchor="start">Confirm screen stale</text><text x="360" y="570" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">stale; no send.</text><text x="360" y="595" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">OFF mode: no send.</text><text x="695" y="570" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Current booking version</text><text x="695" y="595" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">remains authoritative.</text><text x="1030" y="570" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Refresh. Inspect send mode</text><text x="1030" y="595" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">and current reservation.</text><path d="M332,585 L350,585" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><path d="M64,732 L1376,732" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="669" font-size="18" fill="#B44940" font-weight="700" text-anchor="start">Write result ambiguous</text><text x="360" y="669" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">UNKNOWN; never resend.</text><text x="360" y="694" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">PENDING stays ACK_PENDING.</text><text x="695" y="669" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Block the load. Keep receipt</text><text x="695" y="694" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">bytes, hash and send step.</text><text x="1030" y="669" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Reconcile read-only. A status</text><text x="1030" y="694" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">read cannot prove ownership.</text><path d="M332,684 L350,684" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><path d="M64,831 L1376,831" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="768" font-size="18" fill="#B44940" font-weight="700" text-anchor="start">Process / receipt-save loss</text><text x="360" y="768" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Old SUBMITTING -&gt; UNKNOWN</text><text x="360" y="793" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">on Reconcile after 60s.</text><text x="695" y="768" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Unsaved receipt may survive</text><text x="695" y="793" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">in browser or logs, not Twin.</text><text x="1030" y="768" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Preserve Copy / Download.</text><text x="1030" y="793" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Escalate; no blind retry.</text><path d="M332,783 L350,783" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">15</text></svg>