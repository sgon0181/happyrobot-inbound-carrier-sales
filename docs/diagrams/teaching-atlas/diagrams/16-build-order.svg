<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">Build slices are construction order, not call steps.</title><desc id="desc">Later slices reuse earlier foundations. One runtime request can cross several build slices.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  HOW THE BUILD FITS TOGETHER</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">Build slices are construction order, not call steps.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">Later slices reuse earlier foundations. One runtime request can cross several build slices.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><circle cx="88" cy="249" r="20" fill="#087F78"/><text x="88" y="256" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">0</text><text x="126" y="243" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Skeleton</text><text x="340" y="243" font-size="20" fill="#18333D" font-weight="400" text-anchor="start">Docs, decisions, folders and tooling.</text><text x="340" y="273" font-size="17" fill="#526770" font-weight="400" text-anchor="start">README, docs/, Makefile, CI</text><path d="M126,296 L1376,296" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><circle cx="88" cy="340" r="20" fill="#087F78"/><text x="88" y="347" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="126" y="334" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Foundations</text><text x="340" y="334" font-size="20" fill="#18333D" font-weight="400" text-anchor="start">Pure rules and a defensive read-only TMS adapter.</text><text x="340" y="364" font-size="17" fill="#526770" font-weight="400" text-anchor="start">core/*; tms/protocol, mapping, client</text><path d="M126,387 L1376,387" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><circle cx="88" cy="431" r="20" fill="#087F78"/><text x="88" y="438" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="126" y="425" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Verify</text><text x="340" y="425" font-size="20" fill="#18333D" font-weight="400" text-anchor="start">HTTP app, storage, authority, email and deployment.</text><text x="340" y="455" font-size="17" fill="#526770" font-weight="400" text-anchor="start">api, config, calls, twin, fmcsa, email</text><path d="M126,478 L1376,478" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><circle cx="88" cy="522" r="20" fill="#087F78"/><text x="88" y="529" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="126" y="516" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Sell</text><text x="340" y="516" font-size="20" fill="#18333D" font-weight="400" text-anchor="start">Search, negotiation, reservation and close.</text><text x="340" y="546" font-size="17" fill="#526770" font-weight="400" text-anchor="start">selling, sale_decisions, bookings</text><path d="M126,569 L1376,569" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><circle cx="88" cy="613" r="20" fill="#087F78"/><text x="88" y="620" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="126" y="607" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Operate</text><text x="340" y="607" font-size="20" fill="#18333D" font-weight="400" text-anchor="start">Rep queue, snapshot, one booking send and recovery.</text><text x="340" y="637" font-size="17" fill="#526770" font-weight="400" text-anchor="start">dashboard, rep_actions, ops-app/</text><path d="M126,660 L1376,660" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><circle cx="88" cy="704" r="20" fill="#087F78"/><text x="88" y="711" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text><text x="126" y="698" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Deliver</text><text x="340" y="698" font-size="20" fill="#18333D" font-weight="400" text-anchor="start">Layered QA, metrics and review materials.</text><text x="340" y="728" font-size="17" fill="#526770" font-weight="400" text-anchor="start">happyrobot/ evals, docs/qa*, submission</text><path d="M126,751 L1376,751" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><rect x="64" y="804" width="1312" height="60" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="88" y="842" font-size="22" fill="#087F78" font-weight="700" text-anchor="start">Runtime example: API (slice 2) -&gt; selling (3) -&gt; pricing / TMS (1) -&gt; bookings (3) -&gt; Twin (2).</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">16</text></svg>