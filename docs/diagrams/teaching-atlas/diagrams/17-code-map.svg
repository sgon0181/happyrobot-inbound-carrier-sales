<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">The dependency arrows point toward rules and adapters.</title><desc id="desc">A module should have one reason to exist. The file index provides the complete inventory.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  HOW THE FILES FIT TOGETHER</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">The dependency arrows point toward rules and adapters.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">A module should have one reason to exist. The file index provides the complete inventory.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><rect x="64" y="220" width="370" height="150" rx="10" fill="#F0F3F4" stroke="#53636B" stroke-width="1.4"/><text x="84" y="250" font-size="23" fill="#53636B" font-weight="700" text-anchor="start">Startup: main.py</text><text x="84" y="280" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">config.py loads settings and policy.</text><text x="84" y="306" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">main.py wires the dependencies.</text><rect x="520" y="220" width="856" height="150" rx="10" fill="#F1ECF8" stroke="#7150A3" stroke-width="1.4"/><text x="540" y="250" font-size="23" fill="#7150A3" font-weight="700" text-anchor="start">HTTP boundary: api.py</text><text x="540" y="280" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Schemas, keys, body limit, routes and voice deadlines.</text><text x="540" y="306" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Routes dispatch; they do not decide a rate.</text><path d="M434,295 L520,295" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="477.0" y="285" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">builds</text><rect x="520" y="445" width="856" height="135" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="540" y="475" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Use cases: calls / selling / rep_actions / dashboard</text><text x="540" y="505" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Coordinate work. Call pure rules, read integrations, persist state.</text><text x="540" y="531" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">bookings owns reservation; sale_decisions computes call edits.</text><path d="M948,370 L948,445" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="948.0" y="397.5" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">dispatch</text><rect x="64" y="659" width="605" height="174" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="84" y="689" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">core/: deterministic rules</text><text x="84" y="719" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">carrier_policy, codes, loads, money, pricing, negotiation</text><text x="84" y="745" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">models describes typed data. No network, files or clock reads.</text><rect x="737" y="659" width="639" height="174" rx="10" fill="#F0F3F4" stroke="#53636B" stroke-width="1.4"/><text x="757" y="689" font-size="23" fill="#53636B" font-weight="700" text-anchor="start">adapters/: outside-world mechanics</text><text x="757" y="719" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Twin SQL / versions; FMCSA HTTP; SMTP email;</text><text x="757" y="745" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">TMS TCP client, strict protocol and field mapping.</text><path d="M750,580 L750,620 L366,620 L366,659" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="500" y="606" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">decide</text><path d="M1145,580 L1145,659" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="1230" y="623" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">read / write</text><path d="M64,447 L64,533" fill="none" stroke="#087F78" stroke-width="1.6"/><text x="82" y="467" font-size="21" fill="#087F78" font-weight="700" text-anchor="start">Read the atlas, then the code</text><text x="82" y="495" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Start with the use case. Follow its imports</text><text x="82" y="520" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">only when a diagram introduces that</text><text x="82" y="545" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">boundary.</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">17</text></svg>