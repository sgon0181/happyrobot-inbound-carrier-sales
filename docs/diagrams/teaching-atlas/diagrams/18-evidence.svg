<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">Implemented locally is different from proven live.</title><desc id="desc">This atlas describes pinned main. Deployment claims below are tracked reports, not new live checks.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  EVIDENCE AND REMAINING WORK</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">Implemented locally is different from proven live.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">This atlas describes pinned main. Deployment claims below are tracked reports, not new live checks.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><rect x="64" y="224" width="410" height="245" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="84" y="254" font-size="13" fill="#087F78" font-weight="700" text-anchor="start">INSPECTED IMPLEMENTATION</text><text x="84" y="284" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">CODE: main 2678845</text><text x="84" y="314" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Verification, search, negotiation,</text><text x="84" y="340" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">reservation, rep actions, recovery, activity</text><text x="84" y="366" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">capture and dashboard are implemented.</text><text x="84" y="392" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Version 4 prompt fixes are local.</text><rect x="515" y="224" width="410" height="245" rx="10" fill="#F1ECF8" stroke="#7150A3" stroke-width="1.4"/><text x="535" y="254" font-size="13" fill="#7150A3" font-weight="700" text-anchor="start">TRACKED DEPLOYMENT EVIDENCE</text><text x="535" y="284" font-size="23" fill="#7150A3" font-weight="700" text-anchor="start">RECORDED: older rollout</text><text x="535" y="314" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Voice Version 3 live. Version 4 draft.</text><text x="535" y="340" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">App Build 17: 2960ffb.</text><text x="535" y="366" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Fly handover: pre-R3 f02d12b.</text><text x="535" y="392" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Sends OFF; new cohort synthetic.</text><rect x="966" y="224" width="410" height="245" rx="10" fill="#FAECE8" stroke="#B44940" stroke-width="1.4"/><text x="986" y="254" font-size="13" fill="#B44940" font-weight="700" text-anchor="start">UNVERIFIED OR UNFINISHED</text><text x="986" y="284" font-size="23" fill="#B44940" font-weight="700" text-anchor="start">OPEN: acceptance + contract</text><text x="986" y="314" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Publish/deploy only after approval.</text><text x="986" y="340" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Human Version 4 voice acceptance.</text><text x="986" y="366" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Final TMS lifecycle, ownership recovery,</text><text x="986" y="392" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">currency, timezone and capacity.</text><text x="64" y="521" font-size="15" fill="#526770" font-weight="700" text-anchor="start">WHAT THE RECORDED TESTS ACTUALLY COVER</text><path d="M64,555 L64,641" fill="none" stroke="#087F78" stroke-width="1.6"/><text x="82" y="575" font-size="21" fill="#087F78" font-weight="700" text-anchor="start">438 automated service tests</text><text x="82" y="603" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Fake integrations and TCP fault servers. This</text><text x="82" y="628" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">atlas did not rerun that suite.</text><path d="M515,555 L515,641" fill="none" stroke="#7150A3" stroke-width="1.6"/><text x="533" y="575" font-size="21" fill="#7150A3" font-weight="700" text-anchor="start">Latest V4 checkpoints: 44 / 44</text><text x="533" y="603" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">22 definitions twice, locked tools. E1/E2 criterion</text><text x="533" y="628" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">clarified; no end webhook test.</text><path d="M966,555 L966,641" fill="none" stroke="#53636B" stroke-width="1.6"/><text x="984" y="575" font-size="21" fill="#53636B" font-weight="700" text-anchor="start">Earlier real Confirm: PENDING</text><text x="984" y="603" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">LD01080 reached ACK_PENDING. No recorded</text><text x="984" y="628" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">live BOOKED confirmation.</text><rect x="64" y="717" width="1312" height="139" rx="10" fill="#FAECE8" stroke="#B44940" stroke-width="1.4"/><text x="88" y="753" font-size="15" fill="#B44940" font-weight="700" text-anchor="start">READ SOURCE WITH FRESHNESS IN MIND</text><text x="88" y="787" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Some summaries are stale: TMS README says the adapter is future; workflow README still lists an earlier QA batch.</text><text x="88" y="829" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">The V4 route-readiness statement conflicts with the older handover. Local /calls/ended exists; live readiness is unverified.</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">18</text></svg>