<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">Follow the values, not just the arrows.</title><desc id="desc">Each row is one transformation in Maria&#x27;s call. These examples are schematic field excerpts.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  DATA FIELD GUIDE</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">Follow the values, not just the arrows.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">Each row is one transformation in Maria&#x27;s call. These examples are schematic field excerpts.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="220" font-size="15" fill="#7150A3" font-weight="700" text-anchor="start">INPUT TO THE SERVICE</text><text x="515" y="220" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">COMPUTED IN MEMORY</text><text x="966" y="220" font-size="15" fill="#286CAE" font-weight="700" text-anchor="start">SAVED AFTER THE STEP</text><rect x="64" y="247" width="400" height="122" rx="10" fill="#F1ECF8" stroke="#7150A3" stroke-width="1.4"/><text x="84" y="277" font-size="23" fill="#7150A3" font-weight="700" text-anchor="start">1. Authority request</text><text x="84" y="307" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">mc: &quot;MC-1234567&quot;</text><rect x="515" y="247" width="400" height="122" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="535" y="277" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Decision / typed objects</text><text x="535" y="307" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Normalize -&gt; &quot;1234567&quot;</text><text x="535" y="333" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Fixture authority -&gt; eligible</text><rect x="966" y="247" width="410" height="122" rx="10" fill="#EB