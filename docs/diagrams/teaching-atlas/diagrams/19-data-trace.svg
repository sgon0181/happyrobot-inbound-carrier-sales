row-twin)"/><rect x="64" y="685" width="400" height="122" rx="10" fill="#F1ECF8" stroke="#7150A3" stroke-width="1.4"/><text x="84" y="715" font-size="23" fill="#7150A3" font-weight="700" text-anchor="start">6. Acceptance request</text><text x="84" y="745" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">load_id: &quot;DEMO01&quot;</text><text x="84" y="771" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">rate: &quot;2025&quot;</text><rect x="515" y="685" width="400" height="122" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="535" y="715" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">Decision / typed objects</text><text x="535" y="745" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Step(ACCEPT, 2025, rounds=1)</text><text x="535" y="771" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Claim -&gt; reserve -&gt; settle</text><rect x="966" y="685" width="410" height="122" rx="10" fill="#EBF2FA" stroke="#286CAE" stroke-width="1.4"/><text x="986" y="715" font-size="23" fill="#286CAE" font-weight="700" text-anchor="start">Durable state + event</text><text x="986" y="745" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">calls: agreement at 2025</text><text x="986" y="771" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">bookings: RESERVED, load snapshot</text><path d="M464,745 L509,745" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><path d="M915,745 L960,745" fill="none" stroke="#286CAE" stroke-width="2" marker-end="url(#arrow-twin)"/><text x="64" y="869" font-size="18" fill="#526770" font-weight="400" text-anchor="start">The saved offer is safe to expose. The internal Load ceiling and the expected code are not part of the public pitch.</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="40