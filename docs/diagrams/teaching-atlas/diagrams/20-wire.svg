<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">An adapter translates bytes into trusted structure.</title><desc id="desc">These are synthetic field excerpts, not commands to run or complete valid TMS records.</desc><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#18333D"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#526770"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#FCFCF8"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C9D6D9"/></marker><marker id="arrow-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087F78"/></marker><marker id="arrow-voice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7150A3"/></marker><marker id="arrow-twin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#286CAE"/></marker><marker id="arrow-person" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B46217"/></marker><marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#53636B"/></marker><marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B44940"/></marker></defs><rect width="1440" height="960" fill="#FCFCF8"/><text x="64" y="48" font-size="15" fill="#087F78" font-weight="700" text-anchor="start">HAPPYROBOT  /  VISUAL TEACHING ATLAS  /  TRANSPORT FIELD GUIDE</text><text x="64" y="108" font-size="42" fill="#18333D" font-weight="700" text-anchor="start">An adapter translates bytes into trusted structure.</text><text x="64" y="151" font-size="21" fill="#526770" font-weight="400" text-anchor="start">These are synthetic field excerpts, not commands to run or complete valid TMS records.</text><path d="M64,178 L1376,178" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><rect x="64" y="228" width="400" height="290" rx="10" fill="#F0F3F4" stroke="#53636B" stroke-width="1.4"/><text x="84" y="258" font-size="23" fill="#53636B" font-weight="700" text-anchor="start">1. Raw ASCII fields</text><text x="84" y="288" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">LOAD_ID:DEMO01</text><text x="84" y="314" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">RATE:2000 | MAX_BUY:2400</text><text x="84" y="340" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">EQTYPE:DRY_VAN</text><text x="84" y="366" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">DIMS:53ft x 8ft x 9ft</text><text x="84" y="392" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">PICKUP_DT:20261106090000</text><path d="M464,375 L509,375" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="486.5" y="365" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">parse</text><rect x="515" y="228" width="400" height="290" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="535" y="258" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">2. Strict protocol boundary</text><text x="535" y="288" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Fresh TCP connection.</text><text x="535" y="314" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Fields parsed by name, not order.</text><text x="535" y="340" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Trim right-space padding.</text><text x="535" y="366" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Require exact END line or ERR.</text><text x="535" y="392" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">Incomplete is not empty.</text><path d="M915,375 L960,375" fill="none" stroke="#526770" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="937.5" y="365" font-size="16" fill="#526770" font-weight="400" text-anchor="middle">map</text><rect x="966" y="228" width="410" height="290" rx="10" fill="#E9F5F1" stroke="#087F78" stroke-width="1.4"/><text x="986" y="258" font-size="23" fill="#087F78" font-weight="700" text-anchor="start">3. Internal Load</text><text x="986" y="288" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">load_id: DEMO01</text><text x="986" y="314" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">loadboard_rate: 2000</text><text x="986" y="340" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">max_rate: 2400 (private)</text><text x="986" y="366" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">dimensions: 636 x 96 x 108 in</text><text x="986" y="392" font-size="19" fill="#18333D" font-weight="400" text-anchor="start">pickup: 6 Nov, 09:00 UTC assumed</text><path d="M64,582 L64,668" fill="none" stroke="#53636B" stroke-width="1.6"/><text x="82" y="602" font-size="21" fill="#53636B" font-weight="700" text-anchor="start">Size bounds</text><text x="82" y="630" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">4096 bytes per line; 256 KiB per whole reply.</text><text x="82" y="655" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Stop at END, not socket close.</text><path d="M515,582 L515,668" fill="none" stroke="#087F78" stroke-width="1.6"/><text x="533" y="602" font-size="21" fill="#087F78" font-weight="700" text-anchor="start">Time bounds for reads</text><text x="533" y="630" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">At most 3 attempts within 6 seconds per read.</text><text x="533" y="655" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">Voice operation deadline: 12 seconds.</text><path d="M966,582 L966,668" fill="none" stroke="#B44940" stroke-width="1.6"/><text x="984" y="602" font-size="21" fill="#B44940" font-weight="700" text-anchor="start">Different rule for booking</text><text x="984" y="630" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">One write exchange, up to 10 seconds. Retain</text><text x="984" y="655" font-size="18" fill="#18333D" font-weight="400" text-anchor="start">reached step and bytes. Never auto-retry.</text><rect x="64" y="736" width="1312" height="112" rx="10" fill="#FAECE8" stroke="#B44940" stroke-width="1.4"/><text x="88" y="772" font-size="15" fill="#B44940" font-weight="700" text-anchor="start">VALID TRANSPORT IS ONLY THE FIRST CHECK</text><text x="88" y="811" font-size="21" fill="#18333D" font-weight="400" text-anchor="start">The typed load still needs availability, schedule, lane, local-hold and pricing checks before anyone hears an offer.</text><path d="M64,897 L1376,897" fill="none" stroke="#C9D6D9" stroke-width="1.6"/><text x="64" y="925" font-size="13" fill="#526770" font-weight="400" text-anchor="start">MAIN 2678845  |  INSPECTED 4 NOV 2026  |  EXAMPLE DATA IS SYNTHETIC</text><text x="1376" y="925" font-size="17" fill="#526770" font-weight="400" text-anchor="end">20</text></svg>