app = 'codex-e2e-lab-sg-20261031'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[[services]]
  internal_port = 8767
  protocol = 'tcp'
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    handlers = ['http']
    port = 80
    force_https = true
  [[services.ports]]
    handlers = ['tls', 'http']
    port = 443
  [[services.tcp_checks]]
    grace_period = '20s'
    interval = '15s'
    timeout = '2s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
