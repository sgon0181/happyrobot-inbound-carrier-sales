# One Fly.io machine for the Carrier Sales Service. It stays up during the demo, because
# the trial stopped machines after about 5 minutes. FMCSA answers from iad (T-5).
app = "happyrobot-carrier-sales-sg"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  # Health needs a key, so Fly checks only that the port answers.
  [[services.tcp_checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
