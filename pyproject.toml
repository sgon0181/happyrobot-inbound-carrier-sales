# Tool configuration. Runtime packages are pinned in requirements.txt.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90", "UP", "S", "BLE", "ANN", "SIM", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests may assert, use seeded randomness and fake tokens, and skip annotations.
"service/tests/*" = ["S101", "S105", "S106", "S311", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["service", "tools"]

[tool.pytest.ini_options]
testpaths = ["service/tests"]

[tool.coverage.run]
branch = true
source = ["service"]
omit = ["service/tests/*"]

[tool.coverage.report]
# A floor on statements and branches combined. Branch coverage on the business
# rules is checked on its own by tools/check_branch_coverage.py.
fail_under = 90
show_missing = true
