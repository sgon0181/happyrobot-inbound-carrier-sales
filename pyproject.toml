# Tool configuration. Runtime packages are pinned in requirements.txt.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90", "UP", "S", "BLE", "ANN", "SIM", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"service/tests/*" = ["S101", "S311", "ANN"]  # asserts, seeded test randomness, annotations

[tool.mypy]
python_version = "3.12"
strict = true
files = ["service"]

[tool.pytest.ini_options]
testpaths = ["service/tests"]

[tool.coverage.run]
branch = true
source = ["service"]
omit = ["service/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
